<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <!-- Inner Soft Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Phone / Headset Icon -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Headband -->
    <path d="M 60 170 C 60 76 136 0 230 0 C 324 0 400 76 400 170" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Left Earpiece -->
    <rect x="36" y="150" width="48" height="90" rx="24" fill="#ffffff" />
    <rect x="20" y="165" width="20" height="60" rx="10" fill="rgba(255,255,255,0.7)" />

    <!-- Right Earpiece -->
    <rect x="376" y="150" width="48" height="90" rx="24" fill="#ffffff" />
    <rect x="420" y="165" width="20" height="60" rx="10" fill="rgba(255,255,255,0.7)" />

    <!-- Microphone boom -->
    <path d="M 396 220 C 396 290 330 330 260 330 L 220 330" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
    <rect x="180" y="314" width="45" height="32" rx="16" fill="#10b981" stroke="#ffffff" stroke-width="4" />

    <!-- Sparkle / Pulse Star -->
    <circle cx="230" cy="140" r="14" fill="#38bdf8" />
    <circle cx="230" cy="140" r="28" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.6" />
  </g>
</svg>